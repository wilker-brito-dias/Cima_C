<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Painel do site</title>
<style>
*{box-sizing:border-box;margin:0}
body{font:16px/1.5 system-ui,sans-serif;background:#F2F4F2;color:#0E1B44;padding:0 0 96px}
:focus-visible{outline:3px solid #E8B93C;outline-offset:2px}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;background:#0E1B44;color:#F2F4F2}
header a{color:inherit;margin-right:16px}
.cols{display:grid;grid-template-columns:1fr 320px;gap:24px;max-width:1100px;margin:24px auto;padding:0 24px;align-items:start}
form,.card{background:#fff;border-radius:12px;padding:20px;display:grid;gap:14px}
.card{max-width:380px;margin:12vh auto}
h1,h2{font-size:1.3rem}
label{display:grid;gap:4px;font-weight:600;font-size:.9rem}
input,textarea{font:inherit;padding:10px;border:1px solid #b9c0d4;border-radius:8px;width:100%}
textarea{min-height:110px}
fieldset{border:1px solid #d5dae8;border-radius:10px;padding:14px;display:grid;gap:12px}
legend{font-weight:700;padding:0 6px}
.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}
img.pv{width:100%;max-height:150px;object-fit:cover;border-radius:8px}
button{font:inherit;font-weight:700;padding:10px 18px;border:0;border-radius:999px;background:#1B3FA0;color:#fff;cursor:pointer}
button.g{background:none;border:2px solid currentColor}
input[type=range]{-webkit-appearance:none;appearance:none;height:16px;min-height:0;padding:0;border:0;border-radius:8px;background:#d5dae8}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;border:3px solid #0B1638;cursor:pointer}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid #0B1638;cursor:pointer}
input.hue{background:linear-gradient(90deg,hsl(0 85% 50%),hsl(45 85% 50%),hsl(90 85% 45%),hsl(135 85% 40%),hsl(180 85% 40%),hsl(225 85% 55%),hsl(270 85% 55%),hsl(315 85% 50%),hsl(360 85% 50%))}
input.sat{background:linear-gradient(90deg,hsl(var(--ph,354) 0% 45%),hsl(var(--ph,354) 100% 45%))}
input.dk{background:linear-gradient(90deg,hsl(var(--ph,354) 40% 3%),hsl(var(--ph,354) 40% 24%))}
input.lum{background:linear-gradient(90deg,hsl(var(--pa,40) 70% 40%),hsl(var(--pa,40) 70% 85%))}
.chips{display:flex;flex-wrap:wrap;gap:8px}
button.chip{background:#fff;color:#0B1638;border:1.5px solid #b9c0d4;padding:6px 14px;font-size:.85rem}
.pvw{border-radius:12px;overflow:hidden}
.pt{padding:22px;color:hsl(var(--c));background:radial-gradient(300px 160px at 90% -10%,hsl(var(--a)/.2),transparent 60%),radial-gradient(260px 200px at -5% 110%,hsl(var(--gl)/.4),transparent 60%),linear-gradient(165deg,hsl(var(--d2)),hsl(var(--d1)) 55%,hsl(var(--d0)))}
.pt b{display:block;font:500 1.4rem Georgia,serif;margin-bottom:4px}.pt span{display:block;opacity:.8;margin-bottom:14px;font-size:.9rem}
.pt i{font-style:normal;font-weight:700;display:inline-block;padding:8px 18px;border-radius:999px;background:hsl(var(--a));color:var(--oa)}
.pl{padding:14px 22px;background:hsl(var(--c));color:hsl(var(--i));display:flex;justify-content:space-between}
.pl em{font-style:normal;font-weight:700;color:hsl(var(--p))}
details{margin-top:4px}summary{cursor:pointer;font-weight:600;font-size:.9rem;margin-bottom:8px}
video.pv{width:100%;max-height:170px;border-radius:8px;background:#000}
.side{display:grid;gap:24px}.hint{font-size:.85rem;opacity:.75}
button[data-clr]{background:none;color:#D93B25;border:2px solid #D93B25;padding:6px 14px;font-size:.85rem;margin-top:6px}
button[data-del]{background:#fff;color:#D93B25;border:2px solid #D93B25}
.bar{position:fixed;inset:auto 0 0;padding:14px 24px;background:#fff;border-top:1px solid #d5dae8;text-align:right}
.bar button{background:#D93B25}
.err{color:#D93B25;min-height:1.4em}
#t{position:fixed;top:16px;left:50%;transform:translate(-50%,-80px);background:#0E1B44;color:#fff;padding:10px 20px;border-radius:999px;transition:transform .25s}
#t.on{transform:translate(-50%,0)}
@media(max-width:800px){.cols{grid-template-columns:1fr}}
</style>
</head>
<body>
<main id="a"></main><div id="t" role="status"></div>
<script src="/tema.js" defer></script>
<script src="admin.js" defer></script>
</body>
</html>
