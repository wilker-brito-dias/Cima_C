<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cimá Carriço - Restaurante e Petiscaria em Linhares</title>
<meta name="description" content="Cimá Carriço, restaurante e petiscaria em Linhares, ES. Veja o cardápio, reserve sua mesa, combine seu evento e saiba como chegar.">
<meta name="theme-color" content="#1f0e10">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@400;500;600&family=Hanken+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:84px}
:root{--d0:354 39% 5%;--d1:354 37% 9%;--d2:354 35% 16%;--gl:354 61% 39%;--i:354 28% 11%;--c:354 9% 96%;--p:354 46% 34%;--a:40 71% 66%;--a2:40 71% 38%;--oa:hsl(354 28% 11%);--d:'Bodoni Moda',serif}
body{font:17px/1.65 'Hanken Grotesk',system-ui,sans-serif;color:hsl(var(--i));background:hsl(var(--c));overflow-x:clip}
body:has(dialog[open]){overflow:hidden}
h1,h2,h3{font-family:var(--d);font-weight:500;letter-spacing:-.01em;line-height:1.1}
a{color:inherit}
:focus-visible{outline:3px solid hsl(var(--a));outline-offset:3px}
.w{max-width:1180px;margin:auto;padding-inline:24px}
.dark{background:radial-gradient(1000px 520px at 88% -8%,hsl(var(--a)/.17),transparent 62%),radial-gradient(900px 640px at -8% 108%,hsl(var(--gl)/.4),transparent 60%),linear-gradient(165deg,hsl(var(--d2)) 0%,hsl(var(--d1)) 52%,hsl(var(--d0)) 100%);color:hsl(var(--c));color-scheme:dark}
section{padding-block:104px}
h2{font-size:clamp(2rem,4.2vw,3.3rem);margin-bottom:24px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 28px;border-radius:999px;background:hsl(var(--a));color:var(--oa);font:700 1rem 'Hanken Grotesk',sans-serif;border:0;cursor:pointer;text-decoration:none;margin:0 10px 10px 0;text-align:center}
.btn.o{background:none;color:inherit;border:1.5px solid currentColor}
.btn.k{background:hsl(var(--i));color:hsl(var(--c))}
.lk{background:none;border:0;padding:0;font:inherit;font-weight:600;color:inherit;cursor:pointer;text-align:left}
header{position:fixed;inset:0 0 auto;z-index:20;color:#fff;transition:background .3s}
header.s,header.open{background:hsl(var(--d0)/.7);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2)}
header .w{display:flex;align-items:center;justify-content:space-between;gap:20px;height:76px}
header .lg{font:500 1.5rem var(--d);text-decoration:none}
nav{display:flex;gap:28px;font-size:.95rem}
nav a{text-decoration:none;font-weight:600}
.hr{display:flex;align-items:center;gap:10px}
.hr .btn{margin:0;min-height:42px}
.mb{display:none;width:44px;height:44px;background:none;border:1.5px solid rgba(255,255,255,.4);border-radius:50%;color:#fff;cursor:pointer;place-items:center}
.mb svg{width:22px;height:22px}
.hero{position:relative;min-height:100svh;display:flex;align-items:flex-end;color:#fff;overflow:hidden;background:radial-gradient(900px 600px at -8% 108%,hsl(var(--gl)/.4),transparent 60%),linear-gradient(165deg,hsl(var(--d2)),hsl(var(--d0)))}
.vw{position:absolute;inset:0}
.hv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hs{position:absolute;inset:0;background:linear-gradient(180deg,hsl(var(--d0)/.55) 0%,hsl(var(--d0)/0) 22%),linear-gradient(90deg,hsl(var(--d0)/.86) 0%,hsl(var(--d0)/.5) 55%,hsl(var(--d0)/.16) 100%),linear-gradient(0deg,hsl(var(--d0)/.92) 0%,hsl(var(--d0)/0) 45%)}
.hc{position:relative;width:100%;padding-block:130px 72px}
.hc h1{max-width:16ch}
h1{font-size:clamp(2.6rem,5.6vw,5rem)}
.hero p{max-width:46ch;margin:24px 0 32px;opacity:.88;font-size:1.1rem}
.st{display:inline-flex;align-items:center;gap:10px;margin-top:20px;font-weight:600;font-size:.95rem}
.st i{width:10px;height:10px;border-radius:50%;background:#3ddc84}.st.f i{background:#ff6b57}
.im{position:relative;overflow:hidden;width:100%}
.im>*{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.b0{fill:hsl(var(--gl))}.b1{fill:hsl(var(--d0))}.b2{fill:hsl(var(--p))}.b3{fill:hsl(var(--a))}
.about{display:grid;grid-template-columns:.85fr 1.15fr;gap:72px;align-items:center}
.about>.im{aspect-ratio:4/5}
.about p{max-width:58ch;font-size:1.12rem}
.dest{display:grid;grid-template-columns:repeat(4,1fr);gap:28px}
.cap .im{aspect-ratio:4/5;border-radius:999px 999px 0 0}
.cap h3{font-size:1.4rem;margin:18px 0 4px}
.cap p{opacity:.75;font-size:.97rem}.cap b{display:block;margin-top:6px;color:hsl(var(--p))}
.gal{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.gal .im{aspect-ratio:1}
.gal>:first-child{grid-column:span 2;grid-row:span 2}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:72px}
.two p{max-width:46ch;opacity:.85;margin-bottom:24px}
form{display:grid;gap:14px}
.f2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
label{display:grid;gap:6px;font-weight:600;font-size:.9rem;min-width:0}
input,textarea,select{font:inherit;font-size:1rem;color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:12px;min-height:48px;width:100%;min-width:0}
select option{color:#000}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;display:block;width:100%;max-width:100%;min-width:0;text-align:left}
input::-webkit-date-and-time-value{text-align:left;margin:0;min-height:1.4em}
.step{display:grid;grid-template-columns:48px 1fr 48px;gap:8px}
.step button{border:1px solid rgba(255,255,255,.35);background:none;color:#fff;border-radius:8px;font-size:1.4rem;cursor:pointer}
.step input{text-align:center}
.chips{margin-top:56px;display:flex;flex-wrap:wrap;gap:10px}
.chips .btn{margin:0}
.nota{font-size:1.2rem;margin-bottom:28px}.nota b{font:500 2.6rem var(--d);margin-right:10px}.nota span{color:hsl(var(--a2))}
.rvw{display:grid;grid-template-columns:auto 1fr;gap:64px;align-items:center}
.rvw.n{grid-template-columns:1fr}
.rot{display:grid}
.rq{grid-area:1/1;opacity:0;visibility:hidden;transition:opacity .9s,visibility .9s;border-left:2px solid hsl(var(--a));padding-left:20px;margin:0}
.rq.on{opacity:1;visibility:visible}
.rq p{font-size:1.15rem;line-height:1.55;max-width:56ch}
.rq footer{margin-top:10px;font-size:.88rem;opacity:.7}
.dots{display:flex;margin-top:14px;padding-left:12px}
.dots button{width:22px;height:22px;border:0;cursor:pointer;background:radial-gradient(circle,hsl(var(--i)/.25) 0 4px,transparent 4.5px)}
.dots button[aria-current=true]{background:radial-gradient(circle,hsl(var(--i)) 0 4px,transparent 4.5px)}
.map{display:grid;grid-template-columns:.9fr 1.1fr;gap:56px}
.map iframe{width:100%;min-height:400px;height:100%;border:0;border-radius:6px}
dl div{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px dotted hsl(var(--i)/.35)}
dt{font-weight:700}address{font-style:normal;font-size:1.2rem;margin-bottom:20px}
.map .st{margin:0 0 20px}
.ft{padding:72px 0 28px}
.ftg{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:40px}
.fb{display:block;font:500 1.7rem var(--d);margin-bottom:12px;text-decoration:none}
.ftg p{opacity:.85;font-size:.97rem;margin-bottom:6px}
.ftg h4{font:700 1rem 'Hanken Grotesk',sans-serif;color:hsl(var(--a));margin-bottom:14px}
.ftg a{text-underline-offset:3px}
.ftg .btn{margin-top:14px}
.fb2{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:56px;padding-top:24px;border-top:1px solid rgba(255,255,255,.18);font-size:.88rem;opacity:.7}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:15;width:58px;height:58px;border-radius:50%;background:#25D366;display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.fab svg{width:30px;height:30px;fill:#fff}
dialog{border:0;padding:0;width:min(960px,96vw);height:min(90svh,900px);max-width:none;max-height:none;border-radius:12px;overflow:hidden;background:#fff}
dialog[open]{display:flex;flex-direction:column}
dialog::backdrop{background:hsl(var(--d0)/.78)}
.mh{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;background:hsl(var(--d1));color:#fff}
.mh span{display:flex;align-items:center;gap:18px;font-size:.9rem}
.mh button{background:hsl(var(--a));color:var(--oa);border:0;border-radius:999px;font-weight:700;min-height:40px;padding:0 20px;cursor:pointer}
dialog iframe{flex:1;border:0;width:100%}
.mc{flex:1;overflow:auto;background:#eee;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column}
.mc iframe{display:block;height:100%}
.mp{display:grid;gap:10px;padding:10px}.mp img{width:100%;height:auto;display:block;background:#fff}
.mz{display:grid;gap:18px;justify-items:center;text-align:center;padding:56px 24px;color:hsl(var(--i))}
.fab{transition:opacity .25s}.fab.hide{opacity:0;pointer-events:none}
@media(max-width:1000px){.ftg{grid-template-columns:1fr 1fr}.dest{grid-template-columns:repeat(2,1fr)}}
@media(max-width:900px){
 section{padding-block:68px}
 .about,.two,.map,.rvw{grid-template-columns:minmax(0,1fr);gap:40px}
 .hero{display:block;min-height:0;padding-top:0;background:linear-gradient(180deg,hsl(var(--d1)),hsl(var(--d0)))}
 .vw{position:relative;inset:auto;aspect-ratio:4/3;width:100%}
 .hs{background:linear-gradient(180deg,hsl(var(--d0)/.6) 0%,hsl(var(--d0)/0) 30%),linear-gradient(0deg,hsl(var(--d1)) 0%,hsl(var(--d1)/0) 34%)}
 .hc{padding-block:6px 48px}
 .mb{display:grid}
 nav{display:none;position:absolute;top:76px;left:0;right:0;flex-direction:column;gap:0;padding:6px 24px 18px;background:hsl(var(--d0)/.97)}
 header.open nav{display:flex}
 nav a,nav .lk{padding:15px 0;font-size:1.05rem;border-bottom:1px solid rgba(255,255,255,.12)}
 .gal{grid-template-columns:repeat(2,1fr)}
 .map iframe{min-height:320px}
 dialog{width:100vw;height:100svh;border-radius:0}
 .ft{padding-top:56px}
}
@media(max-width:560px){
 .f2,.ftg{grid-template-columns:minmax(0,1fr)}
 .hero .btn,.chips .btn,.map .btn,.actions .btn{width:100%;margin-right:0}
 .dest{gap:16px}.cap h3{font-size:1.15rem}
 .cap p{font-size:.9rem}
 header .lg{font-size:1.25rem}
 .w{padding-inline:20px}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<div id="app"></div>
<script src="tema.js" defer></script>
<script src="site.js" defer></script>
</body>
</html>
